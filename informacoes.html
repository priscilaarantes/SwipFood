<!-- lista de informações disponíveis sobre o restaurante de match do usuário -->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Informações - Ponto do Açaí</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style_informacoes.css">
</head>
<body>

    <div class="info-container">
        
        <h1 class="info-title">Outras informações</h1>

        <div class="info-content">
            
            <div class="gallery-container">
                <img src="img/acaiadd.jpg" alt="Logo Ponto do Açaí" class="gallery-img">
                <img src="img/acaicopo.jpg" alt="Açaí no Copo" class="gallery-img"> 
                <img src="img/barcaacai.jpg" alt="Barca açaí" class="gallery-img">
                <img src="img/tacaacai.jpg" alt="Açai na taça" class="gallery-img">
                <img src="img/acaifruta.jpg" alt="Açaí com frutas" class="gallery-img">
                <img src="img/acaibanmgran.jpg" alt="Açaí com granola" class="gallery-img">
                <img src="img/acaininho.jpg" alt="Açaí com leite ninho" class="gallery-img">
                <img src="img/acainutella.jpg" alt="Açaí com nutella" class="gallery-img">

            </div>

            <div class="details-container">
                
                <div class="tag-group">
                    <span class="tag tag-green">#Dinheiro</span>
                    <span class="tag tag-green">#Pix</span>
                    <span class="tag tag-green">#Cartão Débito</span>
                    <span class="tag tag-green">#Cartão Crédito</span>
                </div>

                <div class="tag-row">
                    <div class="tag-group">
                        <span class="tag tag-pink">#Delivery</span>
                        <span class="tag tag-pink">#Retirada</span>
                        <span class="tag tag-pink">#Refeição no Local</span>
                    </div>
                    <div class="tag-group">
                        <span class="tag tag-purple">#infatil</span>
                        <span class="tag tag-purple">#Familiar</span>
                    </div>
                </div>

                <div class="tag-row">
                    <div class="tag-group">
                        <span class="tag tag-grey">#Estacionamento gratuito e aberto</span>
                        <span class="tag tag-grey">#Banheiros</span>
                    </div>
                    <div class="tag-group">
                        <span class="tag tag-blue">#Acessibilidade Nivel A</span>
                    </div>
                </div>

                <div class="action-buttons">
                    <a href="adicionar link do ifood" target="_blank" class="dark-btn">Veja no iFood</a>
                    <a href="adiicionar link do zap" target="_blank" class="dark-btn">WhatsApp: (66) 99255-9886</a>
                    <a href="adicionar link do googlemaps" target="_blank" class="dark-btn">Veja no Google</a>
                </div>

                <div class="social-links">
                    <a href="adicionar link real do face" target="_blank" title="Facebook">
                        <i class="fa-brands fa-facebook"></i>
                    </a>
                    
                    <a href="adicionar link real do email" title="Email">
                        <i class="fa-regular fa-envelope"></i>
                    </a>
                    
                    <a href="adicionar link real do instagram" target="_blank" title="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                </div>

            </div>
        </div>

        <a href="match.html" class="back-btn">
            ← Voltar para o Match
        </a>

    </div>

</body>
</html>
