    <link rel="stylesheet" href="style_matchpart.css">

    <div class="match-container">

                <a href="ranking.html" class="action-btn">

                    veja mais<br>informações..
                </a>
            </div>

        </div>

        <!-- BOTÃO PARA VOLTAR PARA O APP -->
        <a href="pagina_inicial.html" class="back-btn">
