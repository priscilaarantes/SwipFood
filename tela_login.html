<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swipfood</title>
    
    <!-- Link para o arquivo CSS externo que contém todos os estilos da página -->
    <!-- class="login-page" no body ativa os estilos específicos da tela de login -->
    <link rel="stylesheet" href="style.css">
</head>

<!-- class="login-page" é usada pelo CSS para aplicar estilos específicos da tela de login -->
<body class="login-page">
    
    <!-- CAIXA BRANCA DO FORMULÁRIO DE LOGIN (com efeito de vidro/borrão) -->
    <!-- A classe "login-container" aplica o estilo de caixa com backdrop-filter blur -->
    <div class="login-container">
        
        <!-- ÁREA DA LOGO -->
        <!-- A classe "login-logo" foi criada para NÃO CONFLITAR com a logo do index -->
        <!-- O index usa a classe "logo", que tem width:60px, então criei uma classe diferente -->
        <div class="login-logo">
            <!-- TAG DA IMAGEM DA LOGO -->
            <!-- onerror: JavaScript que executa se a imagem falhar - mostra um placeholder -->
            <img src="logo.png" alt="Swipfood" 
                 onerror="this.src='https://via.placeholder.com/180x60/1C1C1C/white?text=Swipfood'">
        </div>
        
        <!-- INÍCIO DO FORMULÁRIO DE LOGIN -->
        <!-- action: página para onde os dados do formulário serão enviados (pagina_inicial.html) -->
        <!-- method: método de envio dos dados (get = envia via URL, padrão sem banco de dados) -->
        <form action="pagina_inicial.html" method="get">
            
            <!-- GRUPO DO CAMPO E-MAIL/CPF/CNPJ -->
            <!-- "input-group" agrupa label + campo de entrada -->
            <div class="input-group">
                <label>CPF/CNPJ ou E-mail</label>
                <!-- placeholder: texto cinza que aparece dentro do campo antes de digitar -->
                <!-- required: torna o campo obrigatório (não deixa enviar se estiver vazio) -->
                <input type="text"
                       placeholder="Digite seu CPF, CNPJ ou e-mail"
                       required>
            </div>
            
            <!-- GRUPO DO CAMPO SENHA -->
            <div class="input-group">
                <label>Senha</label>
                <input type="password"             
                       placeholder="Digite sua senha" 
                       required>
            </div>
            
            <!-- BOTÃO DE ENTRAR -->
            <!-- envia o formulário (redireciona para pagina_inicial.html) -->
            <button type="submit" class="btn-entrar">Entrar</button>
        </form>
        <!-- FIM DO FORMULÁRIO -->
        
        <!-- DIVISOR COM "ou" - linhas dos dois lados -->
        <!-- O CSS usa ::before e ::after para criar as linhas automaticamente -->
        <div class="divider">
            <span>ou</span>  <!-- Texto "ou" que fica entre as linhas -->
        </div>
        
        <!-- BOTÃO DE CRIAR CONTA -->
        <!-- onclick: JavaScript que executa ao clicar - redireciona para a página de cadastro -->
        <button class="btn-criar-conta" onclick="window.location.href='cadastro_usuario.html'">
            Criar conta
        </button>
        
        <!-- TEXTO INFORMATIVO ABAIXO DO BOTÃO -->
        <div class="link-cadastro">
            <p>faça parte do nosso site</p>
        </div>
        
        <!-- LINK PARA VOLTAR PARA A PÁGINA INICIAL -->
        <!-- class="back-link": aplica estilos de link (sem sublinhado, cor preta) -->
        <a href="index.html" class="back-link">← Voltar para página inicial</a>
    </div>
    <!-- FIM DA CAIXA DO FORMULÁRIO DE LOGIN -->
</body>
</html>
